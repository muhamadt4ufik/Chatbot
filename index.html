<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Taufik AI</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .chat-container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            width: 100%;
            max-width: 700px;
            height: 90vh;
            max-height: 800px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .chat-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 20px 25px;
            color: white;
            display: flex;
            align-items: center;
            gap: 15px;
            flex-shrink: 0;
        }

        .chat-header .avatar {
            width: 48px;
            height: 48px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            border: 2px solid rgba(255, 255, 255, 0.5);
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
            flex-shrink: 0;
        }

        .chat-header .avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .bot-avatar-mini {
            width: 22px;
            height: 22px;
            border-radius: 50%;
            object-fit: cover;
            vertical-align: middle;
            margin-right: 8px;
            border: 1px solid #e2e8f0;
            display: inline-block;
        }

        .chat-header .info h2 {
            font-size: 18px;
            font-weight: 600;
        }

        .chat-header .info p {
            font-size: 12px;
            opacity: 0.8;
            margin-top: 2px;
        }

        .chat-header .status {
            margin-left: auto;
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 12px;
        }

        .status-dot {
            width: 10px;
            height: 10px;
            background: #4ade80;
            border-radius: 50%;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }

        #chatBox {
            flex: 1;
            overflow-y: auto;
            padding: 20px 25px;
            background: #f8f9fa;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .message {
            max-width: 80%;
            padding: 12px 18px;
            border-radius: 18px;
            line-height: 1.5;
            word-wrap: break-word;
            white-space: pre-wrap;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .message.user {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            align-self: flex-end;
            border-bottom-right-radius: 4px;
        }

        .message.bot {
            background: white;
            color: #333;
            align-self: flex-start;
            border-bottom-left-radius: 4px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.05);
        }

        .message .timestamp {
            font-size: 10px;
            opacity: 0.6;
            margin-top: 5px;
            display: block;
        }

        .message.user .timestamp {
            text-align: right;
        }

        .typing-indicator {
            align-self: flex-start;
            background: white;
            padding: 12px 20px;
            border-radius: 18px;
            border-bottom-left-radius: 4px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.05);
            display: flex;
            gap: 5px;
            align-items: center;
        }

        .typing-indicator span {
            width: 8px;
            height: 8px;
            background: #999;
            border-radius: 50%;
            display: inline-block;
            animation: typing 1.4s infinite both;
        }

        .typing-indicator span:nth-child(2) {
            animation-delay: 0.2s;
        }
        .typing-indicator span:nth-child(3) {
            animation-delay: 0.4s;
        }

        @keyframes typing {
            0%, 60%, 100% {
                transform: translateY(0);
                background: #999;
            }
            30% {
                transform: translateY(-10px);
                background: #667eea;
            }
        }

        #inputArea {
            padding: 15px 20px;
            background: white;
            border-top: 1px solid #e9ecef;
            display: flex;
            gap: 12px;
            flex-shrink: 0;
            align-items: flex-end;
        }

        .input-wrapper {
            flex: 1;
            position: relative;
        }

        #userInput {
            width: 100%;
            padding: 12px 45px 12px 18px;
            border: 2px solid #e9ecef;
            border-radius: 25px;
            font-size: 14px;
            outline: none;
            transition: all 0.3s;
            resize: none;
            font-family: inherit;
            min-height: 48px;
            max-height: 120px;
            line-height: 1.5;
        }

        #userInput:focus {
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .char-count {
            position: absolute;
            right: 15px;
            bottom: 12px;
            font-size: 11px;
            color: #adb5bd;
        }

        #sendBtn {
            padding: 12px 24px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 25px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            min-height: 48px;
            display: flex;
            align-items: center;
            gap: 8px;
            flex-shrink: 0;
        }

        #sendBtn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        #sendBtn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        #chatBox::-webkit-scrollbar {
            width: 6px;
        }

        #chatBox::-webkit-scrollbar-track {
            background: transparent;
        }

        #chatBox::-webkit-scrollbar-thumb {
            background: #d1d5db;
            border-radius: 3px;
        }

        @media (max-width: 600px) {
            .chat-container {
                height: 100vh;
                max-height: 100vh;
                border-radius: 0;
            }
            body {
                padding: 0;
            }
            .message {
                max-width: 90%;
            }
            #inputArea {
                padding: 10px 15px;
            }
            #sendBtn {
                padding: 12px 16px;
                min-width: 60px;
            }
            #sendBtn span {
                display: none;
            }
        }

        .message.error {
            background: #fee2e2;
            color: #dc2626;
            align-self: center;
            text-align: center;
            font-size: 13px;
            border: 1px solid #fecaca;
        }

        .message.system {
            background: #fef3c7;
            color: #92400e;
            align-self: center;
            text-align: center;
            font-size: 13px;
            border: 1px solid #fde68a;
        }
    </style>
</head>
<body>
    <div class="chat-container">
        <div class="chat-header">
            <div class="avatar">
                <img src="Profile.jpg" alt="Taufik AI" onerror="this.onerror=null; this.parentElement.textContent='👤';">
            </div>
            <div class="info">
                <h2>Taufik AI</h2>
                <p id="modelInfo">Powered by Groq</p>
            </div>
            <div class="status">
                <span class="status-dot"></span>
                <span>Online</span>
            </div>
        </div>

        <div id="chatBox"></div>

        <div id="inputArea">
            <div class="input-wrapper">
                <textarea 
                    id="userInput" 
                    placeholder="Tulis pesan..." 
                    rows="1"
                    maxlength="2000"
                ></textarea>
                <span class="char-count" id="charCount">0/2000</span>
            </div>
            <button id="sendBtn">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/>
                </svg>
                <span>Kirim</span>
            </button>
        </div>
    </div>

    <script src="config.js"></script>
    <script>
        // ===== KONFIGURASI =====
        const API_KEY = (typeof CONFIG !== 'undefined' && CONFIG.API_KEY) ? CONFIG.API_KEY.trim() : '';
        // Jika dijalankan secara lokal dengan config.js, panggil Groq langsung.
        // Jika di-hosting online (Vercel / web publik), panggil endpoint backend /api/chat tanpa expose key.
        const IS_LOCAL_FILE = window.location.protocol === 'file:';
        const API_URL = API_KEY 
            ? 'https://api.groq.com/openai/v1/chat/completions' 
            : '/api/chat';
        const MAX_TOKENS = 800;

        // Model kandidat yang aktif di Groq
        const AVAILABLE_MODELS = [
            (typeof CONFIG !== 'undefined' && CONFIG.MODEL) ? CONFIG.MODEL : 'openai/gpt-oss-120b',
            'openai/gpt-oss-120b',
            'openai/gpt-oss-20b',
            'qwen/qwen3.8-27b',
            'groq/compound-mini'
        ];
        const MODEL_CANDIDATES = [...new Set(AVAILABLE_MODELS)];
        let currentModel = MODEL_CANDIDATES[0];

        const chatBox = document.getElementById('chatBox');
        const userInput = document.getElementById('userInput');
        const sendBtn = document.getElementById('sendBtn');
        const charCount = document.getElementById('charCount');
        const modelInfo = document.getElementById('modelInfo');

        if (modelInfo) {
            modelInfo.textContent = `Groq • ${currentModel.split('/').pop()}`;
        }

        let isProcessing = false;
        let messageHistory = [];

        function addMessage(text, sender, extraClass = '') {
            const div = document.createElement('div');
            div.className = `message ${sender} ${extraClass}`.trim();

            const textSpan = document.createElement('span');
            textSpan.textContent = text;

            if (sender === 'bot') {
                const botAvatar = document.createElement('img');
                botAvatar.src = 'Profile.jpg';
                botAvatar.className = 'bot-avatar-mini';
                botAvatar.alt = 'Taufik AI';
                botAvatar.onerror = function() { this.style.display = 'none'; };
                div.appendChild(botAvatar);
                div.appendChild(textSpan);
            } else {
                div.appendChild(textSpan);
            }

            const time = document.createElement('span');
            time.className = 'timestamp';
            time.textContent = new Date().toLocaleTimeString('id-ID', {
                hour: '2-digit',
                minute: '2-digit'
            });
            div.appendChild(time);

            chatBox.appendChild(div);
            scrollToBottom();

            if (!extraClass) {
                messageHistory.push({ role: sender === 'user' ? 'user' : 'assistant', content: text });
            }
        }

        function showTyping() {
            const div = document.createElement('div');
            div.className = 'typing-indicator';
            div.id = 'typingIndicator';
            div.innerHTML = '<span></span><span></span><span></span>';
            chatBox.appendChild(div);
            scrollToBottom();
        }

        function hideTyping() {
            const indicator = document.getElementById('typingIndicator');
            if (indicator) indicator.remove();
        }

        function scrollToBottom() {
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        function autoResize() {
            userInput.style.height = 'auto';
            userInput.style.height = Math.min(userInput.scrollHeight, 120) + 'px';
        }

        function updateCharCount() {
            const count = userInput.value.length;
            charCount.textContent = `${count}/2000`;
            charCount.style.color = count > 1800 ? '#dc2626' : '#adb5bd';
        }

        async function requestGroqChat(messages, model) {
            const headers = {
                'Content-Type': 'application/json'
            };
            if (API_KEY) {
                headers['Authorization'] = `Bearer ${API_KEY}`;
            }

            const response = await fetch(API_URL, {
                method: 'POST',
                headers: headers,
                body: JSON.stringify({
                    model: model,
                    messages: messages,
                    max_tokens: MAX_TOKENS,
                    temperature: 0.7
                })
            });
            const data = await response.json();
            return { response, data };
        }

        async function sendMessage() {
            const message = userInput.value.trim();
            
            if (!message || isProcessing) return;
            if (message.length > 2000) {
                addMessage('⚠️ Pesan terlalu panjang! Maksimal 2000 karakter.', 'system');
                return;
            }

            if (!API_KEY && IS_LOCAL_FILE) {
                addMessage('❌ API Key tidak ditemukan! Karena dibuka secara lokal (file://), pastikan file config.js ada di folder yang sama dan berisi API_KEY yang valid.', 'error');
                return;
            }

            userInput.value = '';
            autoResize();
            updateCharCount();

            addMessage(message, 'user');

            isProcessing = true;
            sendBtn.disabled = true;
            userInput.disabled = true;

            showTyping();

            try {
                const contextMessages = messageHistory.slice(-6);
                const messages = [
                    { role: 'system', content: 'Anda adalah Taufik AI, asisten AI pribadi yang ramah, cerdas, dan membantu. Selalu jawab dengan bahasa Indonesia yang sopan, jelas, dan natural.' },
                    ...contextMessages
                ];

                let reply = null;
                let lastError = null;

                for (let i = 0; i < MODEL_CANDIDATES.length; i++) {
                    const candidate = MODEL_CANDIDATES[i];
                    console.log(`📤 Mengirim request ke Groq (Model: ${candidate})...`);
                    
                    const { response, data } = await requestGroqChat(messages, candidate);
                    
                    if (response.ok && data.choices && data.choices.length > 0) {
                        currentModel = candidate;
                        if (modelInfo) {
                            modelInfo.textContent = `Groq • ${currentModel.split('/').pop()}`;
                        }
                        reply = data.choices[0].message.content.trim();
                        break;
                    }

                    const errorMsg = data.error?.message || `HTTP ${response.status}`;
                    console.warn(`Model ${candidate} gagal:`, errorMsg);

                    if (response.status === 401) {
                        throw new Error('API Key tidak valid. Silakan periksa key di console.groq.com');
                    } else if (response.status === 429) {
                        throw new Error('Limit/kuota request terlampaui. Tunggu beberapa saat lalu coba lagi.');
                    }

                    lastError = errorMsg;
                }

                hideTyping();

                if (reply) {
                    addMessage(reply, 'bot');
                } else {
                    throw new Error(lastError || 'Gagal mendapatkan respon dari AI.');
                }

            } catch (error) {
                hideTyping();
                addMessage(`❌ ${error.message}`, 'error');
                console.error('❌ Error detail:', error);
            } finally {
                isProcessing = false;
                sendBtn.disabled = false;
                userInput.disabled = false;
                userInput.focus();
            }
        }

        sendBtn.addEventListener('click', sendMessage);

        userInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });

        userInput.addEventListener('input', () => {
            autoResize();
            updateCharCount();
        });

        setTimeout(() => {
            if (!API_KEY && IS_LOCAL_FILE) {
                addMessage('⚠️ File config.js tidak terbaca atau API_KEY belum diisi. Pastikan file config.js ada di folder yang sama dengan file Chatbot web.html.', 'error');
            } else {
                addMessage('👋 Halo! Saya Taufik AI. Ada yang bisa saya bantu hari ini? Silahkan Anda bertanya apapun', 'bot');
            }
        }, 300);

        userInput.focus();

        console.log('✨ Taufik AI siap!');
        console.log('🔑 API Key:', API_KEY ? '✅ Terdeteksi' : '❌ Tidak terdeteksi');
        console.log('📦 Model aktif:', currentModel);
    </script>
</body>
</html>
